<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tilt and Flip Card</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #219ebc, #023047);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 300px;
      height: 200px;
      perspective: 1000px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      border-radius: 15px;
      position: absolute;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .card-front {
      background: linear-gradient(135deg, #ffb703, #fb8500);
    }

    .card-back {
      background: linear-gradient(135deg, #8ecae6, #219ebc);
      transform: rotateY(180deg);
    }

    body:hover .card-inner {
      transform: rotateX(var(--rotateX)) rotateY(var(--rotateY));
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="card-inner">
      <div class="card-face card-front">
        Front Side
      </div>
      <div class="card-face card-back">
        Back Side
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const cardInner = document.querySelector('.card-inner');

    document.body.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = -(y - centerY) / 10;
      const rotateY = (x - centerX) / 10;

      cardInner.style.setProperty('--rotateX', `${rotateX}deg`);
      cardInner.style.setProperty('--rotateY', `${rotateY}deg`);
    });

    document.body.addEventListener('mouseleave', () => {
      cardInner.style.transform = 'rotateX(0) rotateY(0)';
    });

    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  </script>

</body>
</html>
